<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room Availability Viewer</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>

<body>
    <div class="container">
        <header>
            <h1>Room Availability</h1>
        </header>

        <main>
            <div class="controls">
                <h2>Available Rooms</h2>
                <p class="search-subtitle">Find empty classrooms instantly.</p>
                <div class="controls-row">
                    <div class="control-group">
                        <label for="building">Building</label>
                        <select id="building">
                            <option value="all">All Buildings</option>
                            <option value="1">FD 1</option>
                            <option value="2">FD 2</option>
                            <option value="3">FD 3</option>
                            <option value="5">LTC</option>
                            <option value="6">NAB</option>
                        </select>
                    </div>

                    <div class="control-group">
                        <label for="day">Day</label>
                        <select id="day">
                            <option value="M">Monday</option>
                            <option value="T">Tuesday</option>
                            <option value="W">Wednesday</option>
                            <option value="Th">Thursday</option>
                            <option value="F">Friday</option>
                            <option value="S">Saturday</option>
                        </select>
                    </div>

                    <div class="control-group">
                        <label for="hour">Hour (1 = 8 AM)</label>
                        <select id="hour">
                            <!-- Filled by JS -->
                        </select>
                    </div>

                    <button id="findBtn">Find</button>
                </div>
            </div>
            <div id="results" class="results-grid">
                <!-- Results go here -->
            </div>

            <!-- Search Section -->
            <div class="search-section">
                <h2>🔍 Search Course / Room</h2>
                <p class="search-subtitle">Look up any room, course number, or course name to see its schedule</p>
                <div class="search-controls">
                    <input type="text" id="searchInput" placeholder="e.g. 1231, CE F244, HIGHWAY...">
                    <button id="searchBtn">Search</button>
                </div>
                <div id="searchResults" class="search-results">
                    <!-- Search results go here -->
                </div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>

</html>
